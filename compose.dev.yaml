name: spooktober-dev
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: spooktober
      POSTGRES_USER: spooktober_owner
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U spooktober_owner -d spooktober']
      interval: 2s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: '1m'
        max-file: '2'
  spooktober:
    build: .
    image: spooktober:local
    env_file: .env
    environment:
      DATABASE_URL: postgres://spooktober_owner:local-development-only@postgres:5432/spooktober?sslmode=disable
      PUBLIC_URL: ''
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: '1m'
        max-file: '2'
volumes:
  postgres-data:
