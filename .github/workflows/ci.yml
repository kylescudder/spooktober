# Checks for pull requests and releases. Runs untrusted PR code, so it has no
# secrets, read-only repository access and no route to production.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: spooktober_test
          POSTGRES_USER: spooktober_owner
          # Disposable, job-local database: no password to store or leak.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spooktober_owner -d spooktober_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://spooktober_owner@127.0.0.1:5432/spooktober_test?sslmode=disable
      E2E_WATCHLIST_DATABASE_URL: postgres://spooktober_owner@127.0.0.1:5432/spooktober_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Test deployment hooks
        run: python3 -B -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Test webhook receiver
        run: node --test deploy/receiver/server.test.mjs
      - name: Install dependencies
        run: HUSKY=0 bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Test integration
        run: bun run test:integration
      - name: Install Playwright browser
        run: bunx --no-install playwright install --with-deps chromium
      - name: Test end-to-end
        run: bun run test:e2e
      - name: Save browser evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: |
            artifacts/tanstack-migration/
            artifacts/year-picker/

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Builds (and so type-checks and unit-tests) the production image without publishing it.
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: spooktober:ci
          provenance: false
          sbom: false
      # Runs the deployer's exact migration and permission commands inside that image
      # against disposable PostgreSQL, so a packaging change cannot break production.
      - name: Test migrations in production image
        env:
          SPOOKTOBER_TEST_IMAGE: spooktober:ci
        run: python3 -B -m unittest discover -s deploy -p test_image.py -v
