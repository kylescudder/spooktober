# Publishes a checked, attested image for every commit on main. GitHub holds
# only webhook/Access credentials, never database, Clerk or shell access.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kylescudder/spooktober

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: SPOOKTOBER_REVISION=${{ github.sha }}
          provenance: false
          sbom: false
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p digests
          echo "$DIGEST" > "digests/${PLATFORM//\//-}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: manifest
        name: Create multi-platform manifest
        run: |
          sources=()
          for file in digests/*; do sources+=("$IMAGE@$(cat "$file")"); done
          docker buildx imagetools create -t "$IMAGE:sha-$GITHUB_SHA" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      # Move the main tag only after the attestation exists.
      - name: Tag main
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: docker buildx imagetools create -t "$IMAGE:main" "$IMAGE@$DIGEST"

  # Asks the host to deploy the attested digest, then requires the host to report this
  # exact digest and revision deployed (failing promptly if it reports a failure)
  # and the public site to serve that revision. The host verifies the attestation
  # itself, so the webhook secret can only trigger a release built from main.
  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Read-only token, used only to fetch deploy/await_release.py.
    permissions:
      contents: read
    environment:
      name: production
      url: https://spooktober.kylescudder.co.uk
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DEPLOY_URL: https://deploy.kylescudder.co.uk/hooks/spooktober
      HEALTH_URL: https://spooktober.kylescudder.co.uk/healthz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy/await_release.py
          sparse-checkout-cone-mode: false
      - name: Check deploy endpoint protection
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          headers=$(mktemp)
          trap 'rm -f "$headers"' EXIT
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --dump-header "$headers" -X POST "$DEPLOY_URL")
          [[ "$status" = 401 || "$status" = 403 ]] || { echo "::error::Cloudflare Access did not block an unauthenticated request ($status)."; exit 1; }
          ! grep -qi '^x-spooktober-deploy-hook: 1' "$headers" || { echo '::error::Unauthenticated request reached the receiver.'; exit 1; }
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --dump-header "$headers" "$DEPLOY_URL?status=1")
          [[ "$status" = 401 || "$status" = 403 ]] || { echo "::error::Cloudflare Access did not block an unauthenticated status request ($status)."; exit 1; }
          ! grep -qi '^x-spooktober-deploy-hook: 1' "$headers" || { echo '::error::Unauthenticated status request reached the receiver.'; exit 1; }
          for path in / /healthz /other; do
            status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "https://deploy.kylescudder.co.uk$path")
            [[ "$status" = 404 ]] || { echo "::error::Non-webhook path returned $status."; exit 1; }
          done
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --dump-header "$headers" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'X-Spooktober-Signature: sha256=invalid' --data '{}' "$DEPLOY_URL")
          [[ "$status" = 401 ]] || { echo "::error::Invalid webhook signature returned $status."; exit 1; }
          grep -qi '^x-spooktober-deploy-hook: 1' "$headers" || { echo '::error::Service token did not reach the receiver.'; exit 1; }
      - name: Check the host can report release status
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          REVISION: ${{ github.sha }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python3 -B deploy/await_release.py preflight
      - name: Request deploy
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          timestamp=$(date +%s)
          echo "REQUEST_TIMESTAMP=$timestamp" >> "$GITHUB_ENV"
          body=$(jq -cn --arg digest "$DIGEST" --arg revision "$GITHUB_SHA" --argjson timestamp "$timestamp" \
            '{digest: $digest, revision: $revision, timestamp: $timestamp}')
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | awk '{print $NF}')
          curl --fail-with-body --silent --show-error --max-time 30 "$DEPLOY_URL" \
            -H "Content-Type: application/json" \
            -H "X-Spooktober-Signature: sha256=$signature" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --data "$body"
      # Fails as soon as the host reports a terminal failure for this digest and
      # revision; stalled hosts fail at HOST_TIMEOUT. Success needs both the host's
      # report and the public site serving this revision.
      - name: Wait for the host and production
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          REVISION: ${{ github.sha }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOST_TIMEOUT: "900"
          READY_TIMEOUT: "180"
        run: python3 -B deploy/await_release.py wait
